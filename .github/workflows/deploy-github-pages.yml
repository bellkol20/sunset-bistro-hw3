# Build and deploy to GitHub Pages (source: GitHub Actions in repo Settings → Pages)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Must match your repository name (same segment as in the Pages URL)
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # GitHub Pages has no SPA fallback; copy index so deep links load the app
      - name: SPA fallback (404 → index)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
